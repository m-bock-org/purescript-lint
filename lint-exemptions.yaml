# Where a rule does not apply, and why. `by-design` is a decision
# and stands; `backlog` is work nobody has done yet, which is what
# a fixer is for and what a nightly may take.
exemptions:
  - rule: facade-layout
    modules:
      - Lint.Rule.Survey
      - Lint.RuleSet.Do
    kind: by-design
    why: >
      Both are public and deliberately two segments deep:
      Lint.Rule.Survey is the survey half of Lint.Rule and belongs
      beside it, and Lint.RuleSet.Do is the do-notation for
      Lint.RuleSet. Moving either under .Internal would hide something
      callers are meant to import.
  - rule: encode-decode-signature
    modules:
      - Lint.Internal.Exemptions
      - Lint.Internal.Spago
    kind: by-design
    why: >
      Decoders named for what they decode - decodeSpagoPkg, decodeExempt
      - which already have the DecodeJson shape the rule wants. The rule
      is matching on the name.
  - rule: no-duplicate-record-shape
    modules:
      - Lint.Internal.Exemptions
      - Test.Lint.ExemptionsSpec
      - Lint
    kind: by-design
    why: >
      The exemption subject record is spelled out in the matcher and
      again in its specs. Naming it would put a type in the public
      interface that exists only to be matched against.
  - rule: combinator-atoms
    modules:
      - Lint.Internal.Exemptions
      - Lint.Internal.Rule
      - Lint.Internal.Spago
      - Lint
      - Lint.Internal.Dedent
    kind: by-design
    why: >
      UNREVIEWED RULE. Added 2026-09-02 and registered Unreviewed.
      Whether it earns its place is undecided, and holding this
      repository to it before that decision is backwards.
  - rule: combinator-one-line
    modules:
      - Lint.Internal.Exemptions
      - Lint.Internal.Rule
    kind: by-design
    why: >
      UNREVIEWED. The weaker half of combinator-atoms; the same decision
      is pending.
  - rule: case-arm-layout
    modules:
      - Lint.Internal.Exemptions
      - Lint.Internal.RuleSet
      - Lint.Internal.Spago
    kind: by-design
    why: >
      UNREVIEWED RULE. Added 2026-09-02. The findings are real - the
      arms genuinely disagree - but the rule has not been reviewed and
      this repository should not be the first thing held to it.
  - rule: comment-policy
    modules:
      - Lint.Internal.Exemptions
      - Test.Lint.ExemptionsSpec
      - Lint.Internal.Dedent
    kind: backlog
    why: >
      Trailing Context blocks, which the public set forbids because that
      convention is this workspace's and a stranger never agreed to it.
      The prose belongs in doc comments on the declarations it
      describes.
  - rule: single-line-signature
    modules:
      - Lint
      - Lint.Internal.Exemptions
      - Lint.Internal.Rule
      - Lint.Internal.Spago
      - Lint.Internal.Survey
    kind: backlog
    why: >
      Signatures with several constrained type variables that do not fit
      on one line. The fix is usually a named type alias.
  - rule: max-delimiter-run
    modules:
      - Lint
      - Lint.Internal.Exemptions
      - Test.Lint.Internal.RuleSetSpec
      - Test.Lint.ReadmeExampleSpec
    kind: backlog
    why: >
      Nested brackets past the limit, mostly record literals and test
      fixtures.
  - rule: max-line-length
    modules:
      - Lint.Internal.Exemptions
      - Test.Lint.Internal.RuleSpec
      - Test.Lint.ReadmeExampleSpec
    kind: backlog
    why: no reason was recorded for this one
  - rule: same-constructor-arm
    modules:
      - Lint.Internal.Exemptions
    kind: backlog
    why: no reason was recorded for this one
  - rule: no-same-kind-block-nesting
    modules:
      - Lint.Internal.Exemptions
      - Lint
    kind: backlog
    why: >
      A case inside a case in the module matcher.
  - rule: no-bare-either-hush
    modules:
      - Lint.Internal.Spago
    kind: backlog
    why: >
      One bare hush dropping a decode error from spago ls packages. It
      wants hushBecause and a written reason - a one-line fix nobody has
      made.
  - rule: no-where-clauses
    modules:
      - Lint
      - Lint.Internal.Rule
    kind: backlog
    why: >
      Two where clauses predating the rule.
  - rule: hoistable-local
    modules:
      - Lint
      - Lint.Internal.Rule
    kind: backlog
    why: no reason was recorded for this one
  - rule: max-function-arity
    modules:
      - Lint
      - Lint.Internal.Rule
    kind: backlog
    why: >
      Two functions past the limit; both want their arguments grouped
      into a record.
  - rule: max-call-stack-depth
    modules:
      - Lint
    kind: backlog
    why: >
      The fix loop threads options, rules and exemptions through four
      frames. Worth restructuring.
  - rule: max-operator-chain
    modules:
      - Lint
      - Lint.Fix
    kind: backlog
    why: >
      Two chains past the limit, both in string building.
  - rule: no-stuttering-name
    modules:
      - Lint
    kind: backlog
    why: >
      One name repeating its module.
  - rule: constant-escape-arm
    modules:
      - Lint
    kind: by-design
    why: >
      UNREVIEWED PAIR. The counterweight to combinator-atoms, which is
      itself unreviewed; adopting one without the other pushes code in a
      direction the other pushes back from.
  - rule: comment-policy
    modules:
      - Test.Lint.FixSpec
    kind: backlog
    why: >
      A spec whose prose sits in trailing blocks. Specs are read by
      whoever changes them, and this one earns its explanation - it took
      four attempts to become a test that could fail.
  - rule: max-do-nesting-depth
    modules:
      - Test.Lint.FixSpec
    kind: backlog
    why: >
      Nested do blocks in the stubbed proposers.
  - rule: no-pure-failure
    modules:
      - Test.Lint.FixSpec
    kind: by-design
    why: >
      A spec's stub proposer returns `Left` to mean declining, which is
      the answer under test rather than a failure being swallowed.
  - rule: no-stuttering-name
    modules:
      - Test.Lint.FixSpec
    kind: backlog
    why: no reason was recorded for this one
  - rule: constant-escape-arm
    modules:
      - Test.Lint.FixSpec
    kind: by-design
    why: >
      UNREVIEWED PAIR. See the entry for Lint.
