# CI, on a hosted runner, with npm.
#
# **This repository is public, and a public repository does not get to
# need a private one to build.** Until now the check was
# `nix flake check` on our own machine, which pulled in al-dente - the
# fleet's private build library - through an `ssh://` flake input. Three
# consequences, all of them paid for:
#
#   1. Nobody outside the organisation could run the check at all. For
#      a package published on Pursuit that is the wrong way round.
#   2. The one runner that serves public repositories carries no key,
#      deliberately - a fork's pull request reaches it, and handing that
#      code a key to private repositories is what the arrangement exists
#      to prevent. So the check could not pass there, and it did not:
#      `Host key verification failed`, on every run whose al-dente
#      revision had left the store.
#   3. Which machine ran a job decided whether it passed, because both
#      of our runners answered to the same label. That is not a check,
#      that is a coin.
#
# So: `ubuntu-latest`, and the toolchain from `package.json`, which
# already carries `purescript`, `spago` and `purs-tidy` - the justfile
# says it does so "because CI installs them with npm", which was true
# before and is true again.
#
# What is lost, said plainly: the house lint does not run here. The
# linter is `purescript-lint-regulator`, which is private, so a public
# repository cannot gate on it without the dependency this file exists
# to remove. ghost-buster still lints this repository nightly from a
# machine that has access, and opens a pull request when it finds
# something - so the coverage is nightly rather than per-commit.
#
# `flake.nix` stays. It is how we work locally, and it is faster than
# this by a wide margin because al-dente has already built the package
# set. It is simply not what a stranger, or a keyless runner, has to
# reach for.
name: check

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci`, not `npm install`: the lockfile is the pin, and a
      # compiler that drifts between runs is a check that drifts.
      - run: npm ci

      - run: npx spago build

      - run: npx spago test

      # The formatter, as a gate rather than as advice. `just format` is
      # the same binary, and this is the one place it is checked.
      - run: npx purs-tidy check 'src/**/*.purs' 'test/**/*.purs'
