# CI, on gaia.
#
# One job, one command, and the command is nix. What a pull request must
# pass is `nix flake check` - the same derivations, built the same way,
# whether nix runs them here or on your machine. Nothing routes through
# the justfile: a developer runner is allowed to be fast and stateful,
# and neither is a property CI should depend on.
#
# This file is meant to be identical in every repository. If a repo
# needs something else checked, that belongs in its flake as another
# check, not as another step here.
#
# `runs-on: gaia` rather than a hosted runner, because gaia already has
# the nix store this repository builds against and the key its private
# flake inputs are fetched with. A hosted runner has neither: it spent
# every run compiling the package set from source, several hundred
# modules, before reaching the first line of this repository's code.
name: check

on:
  pull_request:
  push:
    branches: [ main ]

# A second push to the same branch cancels the first. CI here is a
# minute of a machine that has other jobs, not an unbounded queue.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [ self-hosted, gaia ]
    steps:
      - uses: actions/checkout@v4

      # One repository builds at a time across all of them. GitHub's
      # `concurrency` is per-repository, so without this the machine
      # can take a compile from every repository at once - and it has
      # 3.8G, which is one purs and no second one. The lock is held for
      # the build, not the queue, so waiting costs a listener and not
      # memory.
      - run: flock -w 3600 /tmp/gaia-ci.lock nix flake check -L
