name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npx spago build --strict

    - name: Test
      run: npx spago test

    - name: Check the README is in sync with the source
      run: |
        cp README.md /tmp/README.before
        PATCHDOWN_FILE_PATH="./README.md" npx spago run -m Patchdown
        diff -u /tmp/README.before README.md
