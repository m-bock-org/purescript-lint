package:
  name: lint-purs
  description: A lint engine for PureScript source.
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: m-bock
      githubRepo: purescript-lint
  dependencies:
    - aff
    - argonaut-core
    - arrays
    - console
    - effect
    - either
    - encode-decode
    - exceptions
    - foldable-traversable
    - foreign-object
    - language-cst-parser
    - maybe
    - newtype
    - node-buffer
    - node-child-process
    - node-fs
    - node-glob-basic
    - node-path
    - ordered-collections
    - prelude
    - strings
    - tailrec
    - transformers
    - tuples
  test:
    main: Test.Lint.Main
    dependencies:
      - bifunctors
      - foldable-traversable
      - node-fs
      - node-os
      - node-path
      - node-process
      - partial
      - refs
      - spec
      - spec-node
