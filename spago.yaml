package:
  name: lint-purs
  description: A lint engine for PureScript source.
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: m-bock
      githubRepo: purescript-lint
  dependencies:
    - aff
    - arrays
    - console
    - effect
    - either
    - encode-decode
    - foldable-traversable
    - foreign-object
    - language-cst-parser
    - maybe
    - node-buffer
    - node-child-process
    - node-fs
    - node-glob-basic
    - node-path
    - ordered-collections
    - prelude
    - strings
    - transformers
    - tuples
  test:
    main: Test.Lint.Main
    dependencies:
      - partial
      - patchdown
      - spec
      - spec-node
workspace:
  packageSet:
    registry: 66.9.0
  extraPackages:
    codec-argonaut:
      git: https://github.com/garyb/purescript-codec-argonaut.git
      ref: dc287c83b79f86f8d9a0045dcb740f0cf9d23ccd
      dependencies:
        - argonaut-core
        - codec
        - variant
        - ordered-collections
        - type-equality
        - foreign-object
    patchdown:
      git: https://github.com/m-bock/purescript-patchdown.git
      ref: 7012c7a839d7c2f8e9d1a8acf9a56d9435eaccc4
    encode-decode:
      git: https://github.com/m-bock/purescript-encode-decode.git
      ref: 07a361b0e42314ee6521b8ccc774eca117be57d0
      dependencies:
        - argonaut-core
        - argonaut-codecs
        - arrays
        - contravariant
        - either
        - foldable-traversable
        - foreign-object
        - heterogeneous
        - maybe
        - ordered-collections
        - prelude
        - record
        - transformers
        - tuples
        - typelevel-prelude
